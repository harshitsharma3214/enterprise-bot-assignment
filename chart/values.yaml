replicaCount: 2

image:
  repository: demo-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: enterprise-bot-demo
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
